name: gke-release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: taiko-ai-services
  REPOSITORY: servo

permissions:
  contents: read

concurrency:
  group: gke-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Validate tag and release metadata
        run: node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"

      - name: Validate changelog entry
        run: node scripts/extract-changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Test contracts
        run: pnpm test:contracts

  push-images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job authenticates to Google Cloud (OIDC); verify and the cross-repo bump job do not need id-token.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Keyless: GitHub OIDC -> Workload Identity Federation -> servo-image-push SA
      # (taiko-infra-mono terraform/taiko-ai-services/iam). That SA can only write the `servo` registry.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUSH_SERVICE_ACCOUNT }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest

      - name: Build and push bundler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bundler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/bundler:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/bundler:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:latest

  # Argo CD (taikoxyz/k8s-configs, ai-services/servo) is the deployer. Merging the bump PR is the deploy.
  bump-k8s-configs:
    needs: push-images
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Nothing untrusted may reach a step that has K8S_CONFIGS_TOKEN. The tag is also checked in `verify`; this keeps
      # the guarantee local to the job that holds the token (the tag goes into sed expressions below).
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH release tag; refusing to bump."
            exit 1
          fi

      - name: Checkout k8s-configs
        uses: actions/checkout@v6
        with:
          repository: taikoxyz/k8s-configs
          ref: main
          token: ${{ secrets.K8S_CONFIGS_TOKEN }}
          persist-credentials: true

      - name: Bump image tags and open PR
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.K8S_CONFIGS_TOKEN }}
        run: |
          set -euo pipefail
          file="ai-services/servo/values.yaml"
          branch="chore/servo-${TAG}"

          sed -E -i "s#(${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/(api|bundler|web):)[^\"]+#\1${TAG}#" "$file"

          if git diff --quiet -- "$file"; then
            echo "Servo ${TAG} is already deployed in k8s-configs; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Safe to rerun after a partial failure: the branch is owned by this automation, so a rerun rebuilds it from
          # main and overwrites whatever an earlier run left, and the PR is only created if no open one exists yet.
          git checkout -B "$branch"
          git add "$file"
          git commit -m "chore(ai-services): bump servo to ${TAG}"
          git push --force origin "HEAD:refs/heads/${branch}"

          existing="$(gh pr list --repo taikoxyz/k8s-configs --head "$branch" --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "An open PR for ${branch} already exists; the branch was updated, nothing more to do."
            exit 0
          fi

          gh pr create \
            --repo taikoxyz/k8s-configs \
            --base main \
            --head "$branch" \
            --title "chore(ai-services): bump servo to ${TAG}" \
            --body "Automated bump from taikoxyz/agent-paymaster release ${TAG}. Merging deploys it through Argo CD (sync the servo Application if automated sync is still off). Verify with the verify-deploy workflow in taikoxyz/agent-paymaster."
